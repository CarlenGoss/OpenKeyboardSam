name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk OpenKeyboardSam-v0.3.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk OpenKeyboardSam-v0.3.0-debug.apk

      - name: Upload APKs as Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenKeyboardSam-APKs
          path: OpenKeyboardSam-v0.3.0-*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.3.0 --yes --cleanup-tag || true
          gh release create v0.3.0 \
            OpenKeyboardSam-v0.3.0-release.apk \
            OpenKeyboardSam-v0.3.0-debug.apk \
            --title "OpenKeyboardSam v0.3.0 (Authentic One UI 6.1 Visual Edition)" \
            --notes "### OpenKeyboardSam v0.3.0 — Clona el look exacto del Teclado Samsung One UI 6.1 (Galaxy S22 Ultra)
          - **Iconografia Vectorial Nativa One UI:** Nuevos iconos vectoriales precisos en Canvas para Shift (normal/activo/CapsLock), Backspace, Enter, Globo de idioma y toda la barra superior (Galaxy AI ✨, Emoji, Portapapeles, S Pen, Voz, Una Mano y Ajustes).
          - **Proporciones y Colores Exactos de Samsung Honeyboard:** Fila numerica superior compacta, sangrado lateral automatico en la fila A-L en ingles, barra espaciadora con chevrons (< Español(ES) >) y paleta exacta One UI Claro (#E5E7EC / #FFFFFF) y Oscuro (#17171A / #2C2C30).
          - **Barra de Prediccion de 3 Columnas con Divisores:** Sugerencia central destacada en azul One UI y divisores verticales finos igual que el teclado original.
          - **Paneles y Ajustes con Tarjetas Redondeadas One UI:** Pantallas de Ajustes, Portapapeles, S Pen y Galaxy AI rediseñadas con tarjetas agrupadas estilo One UI 6.1."
