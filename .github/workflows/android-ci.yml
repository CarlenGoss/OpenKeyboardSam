name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk OpenKeyboardSam-v0.2.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk OpenKeyboardSam-v0.2.0-debug.apk

      - name: Upload APKs as Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenKeyboardSam-APKs
          path: OpenKeyboardSam-v0.2.0-*.apk
